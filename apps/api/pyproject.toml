[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "muqeetkhan", email = "muqeetkhan050@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.2",
    "fastapi>=0.141.1",
    "google-genai>=2.22.0",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
